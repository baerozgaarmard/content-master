<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#131424" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 52px; fill: #ffffff; letter-spacing: -1.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 19px; fill: #94a3b8; font-weight: 400; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; fill: #94a3b8; line-height: 1.5; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Background -->
  <rect width="1200" height="460" rx="16" fill="url(#bg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="140" fill="#8a2be2" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1000" cy="120" r="160" fill="#00f0ff" opacity="0.16" filter="url(#glow)"/>
  <circle cx="600" cy="400" r="150" fill="#ff007f" opacity="0.12" filter="url(#glow)"/>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="458" rx="15" fill="none" stroke="#2a2d4a" stroke-width="1.5" />

  <!-- Brand Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="32" rx="16" fill="#1e1f38" stroke="#3b3d64" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#00f0ff" />
    <text x="32" y="21" class="tag" fill="#00f0ff">BEAROZGAARMARD</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="132" class="title">CONTENT MASTER</text>
  <text x="60" y="168" class="subtitle">The Autonomous AI Video &amp; Short-Form Suite for Modern Creators</text>

  <!-- 3 Feature Cards -->
  <!-- Card 1: Flick -->
  <g transform="translate(60, 215)">
    <rect width="335" height="195" rx="14" fill="url(#cardGrad1)" stroke="#8a2be2" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="#8a2be2" opacity="0.25" />
    <text x="27" y="42" font-size="18">🎬</text>
    <text x="70" y="42" class="card-title">Flick Motion</text>
    <rect x="235" y="24" width="75" height="22" rx="11" fill="#8a2be2" fill-opacity="0.3" />
    <text x="247" y="39" class="tag" fill="#d8b4fe">REMOTION</text>

    <text x="24" y="85" class="card-desc">Turn any video, link or script into</text>
    <text x="24" y="107" class="card-desc">scene-by-scene kinetic animations</text>
    <text x="24" y="129" class="card-desc">with audio-matched sound effects.</text>

    <rect x="24" y="152" width="287" height="26" rx="6" fill="#111222" />
    <text x="36" y="169" font-family="monospace" font-size="11" fill="#a78bfa">$ flick &quot;animate this script&quot;</text>
  </g>

  <!-- Card 2: Faceless -->
  <g transform="translate(432, 215)">
    <rect width="335" height="195" rx="14" fill="url(#cardGrad1)" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="#00f0ff" opacity="0.25" />
    <text x="27" y="42" font-size="18">🎭</text>
    <text x="70" y="42" class="card-title">Faceless Reels</text>
    <rect x="235" y="24" width="75" height="22" rx="11" fill="#00f0ff" fill-opacity="0.2" />
    <text x="247" y="39" class="tag" fill="#67e8f9">AI VOICES</text>

    <text x="24" y="85" class="card-desc">Peter &amp; Stewie / Rick &amp; Morty reels</text>
    <text x="24" y="107" class="card-desc">with Fish Audio voices, Minecraft</text>
    <text x="24" y="129" class="card-desc">parkour, and reactive captions.</text>

    <rect x="24" y="152" width="287" height="26" rx="6" fill="#111222" />
    <text x="36" y="169" font-family="monospace" font-size="11" fill="#38bdf8">$ faceless &quot;create reel&quot;</text>
  </g>

  <!-- Card 3: MCP Agent -->
  <g transform="translate(805, 215)">
    <rect width="335" height="195" rx="14" fill="url(#cardGrad1)" stroke="#ff007f" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="#ff007f" opacity="0.25" />
    <text x="27" y="42" font-size="18">⚡</text>
    <text x="70" y="42" class="card-title">Agent MCP</text>
    <rect x="235" y="24" width="75" height="22" rx="11" fill="#ff007f" fill-opacity="0.25" />
    <text x="245" y="39" class="tag" fill="#f472b6">PROTOCOL</text>

    <text x="24" y="85" class="card-desc">High-speed video intelligence,</text>
    <text x="24" y="107" class="card-desc">viral hook discovery, and outlier</text>
    <text x="24" y="129" class="card-desc">ranking for Claude, Codex &amp; AGY.</text>

    <rect x="24" y="152" width="287" height="26" rx="6" fill="#111222" />
    <text x="36" y="169" font-family="monospace" font-size="11" fill="#f472b6">claude mcp add content-master</text>
  </g>
</svg>
